<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 p-8">
    <div x-data="{ showModal: false }">
        <button
            @click="showModal = true"
            class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
            Modalı Aç
        </button>

        <!-- Modal -->
        <div x-show="showModal"
             @click="showModal = false"
             class="fixed inset-0 bg-gray-500 bg-opacity-75 z-50 flex items-center justify-center p-4">
            <div @click.stop class="bg-white rounded-lg shadow-xl w-full max-w-lg mx-auto p-6">
                <h3 class="text-lg font-medium text-gray-900 mb-4">Test Modal</h3>
                <p>Modal işləyir!</p>
                <button
                    @click="showModal = false"
                    class="mt-4 px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600">
                    Bağla
                </button>
            </div>
        </div>
    </div>

    <div class="mt-8 text-sm text-gray-600">
        <p>Bu test səhifəsidir. Alpine.js işləyir ya yox yoxlamaq üçündür.</p>
        <p class="mt-2">Əgər düymə işləyirsə, Alpine.js düzgün yüklənib.</p>
    </div>
</body>
</html>
