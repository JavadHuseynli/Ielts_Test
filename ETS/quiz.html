<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Quiz App</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f2f2f2;
        }

        header {
            background-color: #343a40;
            color: #ffffff;
            text-align: center;
            padding: 20px 0;
            font-size: 24px;
        }

        .container {
            display: flex;
            max-width: 1200px;
            margin: 20px auto;
        }

        .passage, .questions {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin: 0 5px; /* Adjusted margin */
            overflow: auto;
            flex-grow: 0.5; /* Adjusted flex-grow */
            min-width: 0; /* Allow content to shrink */
        }

        .timer-container {
            background-color: #007bff;
            color: #ffffff;
            text-align: center;
            padding: 20px 0;
            font-size: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        button {
            background-color: #28a745;
            color: #ffffff;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #218838;
        }

        .confirm-button {
            background-color: #007bff;
        }

        .confirm-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<header>
    <h1>Modern Quiz App</h1>
</header>

<div class="timer-container" id="timer">00:00</div>

<div class="container">
    <div class="passage" id="passage">
        <h2>Quiz Topic</h2>
        <p>
            Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
            Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.
        </p>
    </div>

    <div class="questions" id="questions">
        <h2>Questions</h2>
        <!-- Questions will be dynamically loaded here -->
    </div>
</div>

<button onclick="startQuiz()" id="startButton">Start Quiz</button>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.1/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<script>
    function startQuiz() {
        // Operations to start the quiz can be implemented here
        alert('Quiz Started!');
        startTimer(300); // 5-minute timer
        loadQuestions(); // Load questions using AJAX
        document.getElementById('startButton').style.display = 'none'; // Hide start button
    }

    function startTimer(duration) {
        var timer = duration, minutes, seconds;
        setInterval(function () {
            minutes = parseInt(timer / 60, 10);
            seconds = parseInt(timer % 60, 10);

            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;

            document.getElementById('timer').textContent = minutes + ":" + seconds;

            if (--timer < 0) {
                timer = duration;
                // Operations when the timer runs out can be performed here
                alert("Time's up!");
            }
        }, 1000);
    }

    function loadQuestions() {
        // Simulate loading questions using AJAX
        var questionsContainer = document.getElementById('questions');
        questionsContainer.innerHTML = '<p>1. What is the capital of France?</p>' +
            '<label><input type="radio" name="q1" value="Paris"> Paris</label>' +
            '<label><input type="radio" name="q1" value="Berlin"> Berlin</label>' +
            '<label><input type="radio" name="q1" value="London"> London</label>' +
            '<p>2. Which programming language is used for web development?</p>' +
            '<label><input type="radio" name="q2" value="JavaScript"> JavaScript</label>' +
            '<label><input type="radio" name="q2" value="Python"> Python</label>' +
            '<label><input type="radio" name="q2" value="Java"> Java</label>' +
            '<button class="confirm-button" onclick="confirmAnswers()">Confirm</button>';
    }

    function confirmAnswers() {
        // Operations to confirm answers can be performed here
        alert('Answers Confirmed!');
    }
</script>

</body>
</html>
